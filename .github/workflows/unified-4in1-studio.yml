        uses: actions/upload-artifact@v4
        with:
          name: Preview-${{ matrix.id }}-Run-${{ github.run_id }}
          path: outputs/${{ matrix.id }}/
          retention-days: 14

      - name: Save to Unpublished GitHub Draft Release (Permanent Free Cloud Storage)
